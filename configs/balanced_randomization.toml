# DWDDRandomizer Settings Export
# Generated: 2026-02-17 23:57:18

[app_data]
APP_VERSION = "0.2.0"
ROM_VERSION = "DUSK_US"
SEED = -1

[randomizer_options]
# Increase dialogue text speed
INCREASE_TEXT_SPEED = true

# Increase overworld movement speed
INCREASE_MOVEMENT_SPEED = true

# Allow longer player names
EXPAND_PLAYER_NAME_LENGTH = true

# Improve battle performance by removing visual effects
IMPROVE_BATTLE_PERFORMANCE = true

# Reduce the wild encounter rate
REDUCE_WILD_ENCOUNTER_RATE = true

# Increase the base digimon scan rate
INCREASE_SCAN_RATE = true

# Increase exp yield from battles (0 = unchanged, 1 = halved, 2 = full)
INCREASE_DIGIMON_EXP = 1

# Increase money earned from wild encounters
INCREASE_WILD_ENCOUNTER_MONEY = true

# Increase farm exp gain
INCREASE_FARM_EXP = true

# Balance Calumon's base stats
BALANCE_CALUMON_STATS = true

# Enable Legendary Tamer quest
ENABLE_LEGENDARY_TAMER_QUEST = true

# Unlock main quests in sequence
UNLOCK_MAIN_QUESTS_IN_SEQUENCE = true

# Unlock version-exclusive areas
UNLOCK_VERSION_EXCLUSIVE_AREAS = true

# Randomize starter packs (0 = unchanged, 1 = same stage, 2 = fully random, 3 = custom)
RANDOMIZE_STARTERS = 1

CUSTOM_STARTER_PACKS = [["MachGaogamon", "Lunamon", "Clockmon"], ["SkullGreymon", "Lunamon", "WarGarurumon(Black)"], ["Megakabuterimon(Blue)", "Lunamon", "Kurisarimon"], ["Pandamon", "Lunamon", "Lillymon"]]

# Nerf first boss to compensate for randomized starters
NERF_FIRST_BOSS = true

# Force at least one starter to be a Rookie
FORCE_STARTER_W_ROOKIE_STAGE = true

# Rookie reset event behavior (0 = unchanged, 1 = reset keeping evo, 2 = do not reset)
ROOKIE_RESET_EVENT = 0

# Randomize overworld items (0 = unchanged, 1 = keep category, 2 = completely)
RANDOMIZE_OVERWORLD_ITEMS = 2

# Randomize quest item rewards (0 = unchanged, 1 = keep category, 2 = completely)
RANDOMIZE_QUEST_ITEM_REWARDS = 0

# Randomize wild digimon encounters (0 = unchanged, 1 = same stage, 2 = completely)
RANDOMIZE_WILD_DIGIMON_ENCOUNTERS = 1

# Randomize wild encounter item drops (0 = unchanged, 1 = keep category, 2 = completely)
RANDOMIZE_WILD_ENCOUNTER_ITEMS = 1

# Stat generation mode for randomized wild encounters
WILD_ENCOUNTERS_STATS = 0

# Randomize fixed battle encounters (0 = unchanged, 1 = same stage, 2 = completely)
RANDOMIZE_FIXED_BATTLES = 1

# Randomize digimon species (0 = unchanged, 1 = random)
RANDOMIZE_DIGIMON_SPECIES = 0

# Allow Unknown species in randomization
SPECIES_ALLOW_UNKNOWN = false

# Randomize elemental resistances (0 = unchanged, 1 = shuffle, 2 = random)
RANDOMIZE_ELEMENTAL_RESISTANCES = 0

# Keep elemental resistances coherent with species
KEEP_SPECIES_RESISTANCE_COHERENCE = false

# Randomize base stats (0 = unchanged, 1 = shuffle, 2 = random sanity, 3 = random completely)
RANDOMIZE_BASE_STATS = 0

# Bias base stat randomization towards digimon type
BASESTATS_STATTYPE_BIAS = false

# Randomize digimon stat type (0 = unchanged, 1 = randomize)
RANDOMIZE_DIGIMON_STATTYPE = 0

# Randomize movesets (0 = unchanged, 1 = species bias, 2 = completely)
RANDOMIZE_MOVESETS = 1

# Filter randomized moves by level proximity
MOVESETS_LEVEL_BIAS = true

# Filter randomized regular moves by power proximity
REGULAR_MOVE_POWER_BIAS = true

# Filter randomized signature moves by power proximity
SIGNATURE_MOVE_POWER_BIAS = true

# Include signature moves in the randomization pool
MOVESETS_SIGNATURE_MOVES_POOL = false

# Guarantee at least one basic (no MP cost) move
MOVESETS_GUARANTEE_BASIC_MOVE = false

# Randomize traits (0 = unchanged, 1 = stage bias, 2 = completely)
RANDOMIZE_TRAITS = 1

# Force all digimon to have four traits
TRAITS_FORCE_FOUR = false

# Include unused traits in the randomization pool
TRAITS_ENABLE_UNUSED = false

# Randomize digivolution trees (0 = unchanged, 1 = randomize)
RANDOMIZE_DIGIVOLUTIONS = 1

# Bias digivolutions towards similar species
DIGIVOLUTIONS_SIMILAR_SPECIES = true

# Randomize digivolution conditions (0 = unchanged, 1 = randomize)
RANDOMIZE_DIGIVOLUTION_CONDITIONS = 1

# Bias conditions towards matching species exp
DIGIVOLUTION_CONDITIONS_FOLLOW_SPECIES_EXP = true

# Randomize DNA digivolutions (0 = unchanged, 1 = same stage, 2 = completely)
RANDOMIZE_DNADIGIVOLUTIONS = 1

# Randomize DNA digivolution conditions (0 = unchanged, 1 = randomize, 2 = removed)
RANDOMIZE_DNADIGIVOLUTION_CONDITIONS = 1

# Bias DNA conditions towards matching species exp
DNADIGIVOLUTION_CONDITIONS_FOLLOW_SPECIES_EXP = true

